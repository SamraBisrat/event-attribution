services:
  - type: web
    name: event-attribution-staging
    runtime: docker
    plan: 0.5c-512mb
    region: ohio
    numInstances: 1
    autoDeployTrigger: off
    healthCheckPath: /health
    disk:
      name: staging-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: file:/var/data/staging.sqlite
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: SCOPES
        value: read_customers,read_orders
      - key: APP_DATA_KEY
        sync: false
